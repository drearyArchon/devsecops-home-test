name: Terraform Security Scan
on: 
  push:
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  terraform_security_scan:
    name: Terraform Scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan Terraform  
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with: 
          scan-type: 'fs' 
          scan-ref: 'terraform/'  # Path to your Terraform files  
          format: 'sarif'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN' 
          exit-code: 0
          output: 'trivy-terraform-results.sarif' 
 
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
            sarif_file: 'trivy-terraform-results.sarif'
  
      - name: Upload IaC Scan Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iac-scan-evidence
          path: 'trivy-terraform-results.sarif'