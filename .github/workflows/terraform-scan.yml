name: Terraform Security Scan
on: 
  push:
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform_security_scan:
    name: Terraform Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 
       
      - name: Scan Terraform  
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: 'fs' 
          scan-ref: 'terraform/'  # Path to your Terraform files  
          format: 'sarif'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN' 
          exit-code: 1
          output: 'trivy-terraform-results.sarif' 
 
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
            sarif_file: 'trivy-terraform-results.sarif'
  
      - name: Upload IaC Scan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-evidence
          path: 'trivy-terraform-results.sarif'